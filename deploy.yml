name: Deploy Discord Bot

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "14"

            - name: Install dependencies
              run: npm install

            - name: Run bot
              env:
                  TOKEN: ${{ secrets.TOKEN }} # 환경변수 사용
                  RIOT_API_KEY: ${{secrets.RIOT_API_KEY=RGAPI-db044306-b366-48fc-894b-598bfa72a08e}}
              run: |
                  node index.js
